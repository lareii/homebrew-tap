name: Update Formulae

on:
  schedule:
    # run once a month on the 1st at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest

    steps:
      - name: Set up Homebrew
        run: |
          brew update
          brew tap lareii/tap

      - name: Check for updates and open PR
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew bump --tap lareii/tap --open-pr
